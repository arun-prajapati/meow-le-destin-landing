<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Le Destin</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <meta
      name="description"
      content="Read this article on the Le Destin blog."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1714;
        --muted: #71695f;
        --gold: #b88a3b;
        --pale: #f7f2e9;
        --cream: #fcfaf6;
        --line: #e9dfcf;
        --dark: #17130f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font: 15px/1.65 "DM Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }
      .wrap {
        width: min(1160px, calc(100% - 40px));
        margin: auto;
      }

      /* HEADER */
      header {
        position: sticky;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: rgba(252, 250, 246, 0.95);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .nav-bar {
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .st-logo {
        height: 52px;
        width: auto;
      }
      .links {
        display: flex;
        gap: 24px;
        align-items: center;
      }
      .links > a:not(.btn) {
        font-size: 13.5px;
        color: var(--muted);
        transition: color 0.2s;
      }
      .links > a:not(.btn):hover {
        color: var(--gold);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 22px;
        border-radius: 999px;
        font-size: 13.5px;
        background: var(--gold);
        color: #fff;
        transition: all 0.25s;
      }
      .btn:hover {
        background: #9d732c;
      }

      /* HERO */
      .legal-hero {
        padding: 48px 0 24px;
        text-align: center;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .back-link:hover {
        color: var(--gold);
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 600;
        margin-bottom: 8px;
      }
      .legal-title {
        font-family: "Playfair Display", serif;
        font-size: clamp(34px, 4.5vw, 48px);
        font-weight: 600;
        color: var(--ink);
      }
      .legal-meta {
        font-size: 13.5px;
        color: var(--muted);
        margin-top: 6px;
      }

      /* SHELL & CARD */
      .legal-shell {
        flex: 1 0 auto;
        max-width: 900px;
        padding: 12px 20px 72px;
        width: 100%;
        margin: 0 auto;
      }
      .legal-card {
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: clamp(24px, 4.5vw, 48px);
        box-shadow: 0 10px 30px rgba(23, 19, 15, 0.03);
      }

      /* LOADING / SPINNER */
      .legal-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 240px;
        color: var(--muted);
        font-size: 13.5px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--line);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .legal-error,
      .legal-empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--muted);
      }

      /* CONTENT */
      .legal-content {
        color: #332d27;
        line-height: 1.8;
      }
      .legal-content > * + * {
        margin-top: 1rem;
      }
      .legal-content h1,
      .legal-content h2,
      .legal-content h3 {
        font-family: "Playfair Display", serif;
        color: var(--ink);
        font-weight: 600;
        margin-top: 2rem;
        margin-bottom: 0.4rem;
      }
      .legal-content strong {
        color: var(--ink);
      }
      .legal-content a {
        color: var(--gold);
        text-decoration: underline;
      }
      .legal-content a:hover {
        color: #9d732c;
      }
      .legal-content ul,
      .legal-content ol {
        padding-left: 1.6rem;
        margin: 0.6rem 0;
      }
      .legal-content li {
        margin-top: 0.35rem;
      }
      .legal-content li > p {
        display: inline;
        margin: 0;
      }

      /* CARD FOOT */
      .card-legal-foot {
        margin-top: 40px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: center;
        gap: 14px;
        font-size: 13px;
        color: var(--muted);
      }
      .card-legal-foot a:hover,
      .card-legal-foot a.active {
        color: var(--gold);
      }

      /* FOOTER */
      footer {
        border-top: 1px solid var(--line);
        padding: 36px 0;
        background: var(--cream);
        margin-top: auto;
      }
      .foot-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 13px;
        color: var(--muted);
      }
      .foot-links {
        display: flex;
        gap: 20px;
      }
      .foot-links a:hover {
        color: var(--gold);
      }

      @media (max-width: 768px) {
        .links > a:not(.btn) {
          display: none;
        }
        .foot-row {
          flex-direction: column;
          text-align: center;
        }
      }
      /* ---------- blog ---------- */
      .blog-intro {
        max-width: 620px;
        margin: 10px auto 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
        text-wrap: pretty;
      }
      .blog-grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
      }
      .blog-card {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.18s ease-out;
      }
      .blog-card:hover {
        border-color: var(--gold);
      }
      .blog-card:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }
      .blog-thumb {
        aspect-ratio: 16 / 9;
        background: var(--pale);
      }
      .blog-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .blog-card-body {
        padding: 20px 22px 24px;
      }
      .blog-date {
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .blog-card h2,
      .blog-card h3 {
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: 24px;
        line-height: 1.2;
        margin: 6px 0 0;
        color: var(--ink);
        text-wrap: balance;
      }
      .blog-excerpt {
        margin-top: 10px;
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
      }
      .blog-message {
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 40px 28px;
        color: var(--muted);
      }
      .blog-message h2 {
        font-family: "Playfair Display", serif;
        font-size: 28px;
        line-height: 1.2;
        color: var(--ink);
        margin-bottom: 8px;
      }
      .blog-message a {
        color: var(--gold);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .blog-message .btn {
        margin-top: 18px;
      }
      .blog-cover {
        margin: 0 0 24px;
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        background: var(--pale);
      }
      .blog-cover img {
        width: 100%;
        height: auto;
        display: block;
      }
      .blog-content img {
        max-width: 100%;
        height: auto;
      }
      .blog-more {
        margin-top: 56px;
      }
      .blog-more > h2 {
        font-family: "Playfair Display", serif;
        font-size: 30px;
        line-height: 1.2;
        color: var(--ink);
        margin-bottom: 18px;
      }
      .legal-hero .blog-date {
        margin-top: 10px;
      }
      @media (prefers-reduced-motion: reduce) {
        .blog-card {
          transition: none;
        }
      }
    </style>

  </head>

    <header>
      <div class="wrap nav-bar">
        <a class="brand" href="/">
          <img class="st-logo" src="/images/le-meow-logo.png" alt="Le Destin" />

        <div class="links">

    </header>

    <section class="legal-hero">
      <div class="wrap">
        <div>
          <a href="/blog.html" class="back-link">
            ← All articles
          </a>
        </div>

        <h1 id="postTitle" class="legal-title">Le Destin Blog</h1>

    <main class="legal-shell">
      <div id="blogPost" aria-live="polite"></div>

    <footer>

    </footer>

    <script src="/blog.js" defer></script>
